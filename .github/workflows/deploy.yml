name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 20 nem elég: a jsdom (a store.test.ts-hez kell) ^22.22.2-t vagy
          # 24.15.0+-t kér (undici-n keresztül) — ez törte el az első
          # vitest-es CI futást. 24-et használunk, ugyanazt, amin helyben
          # is teszteltem, hogy ne legyen köztes verziós meglepetés.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
        env:
          GH_PAGES: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
